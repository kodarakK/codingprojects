<!DOCTYPE html>
<html>
  <head>
    <title>Click Me!</title>
    <style>
      #clickMe {
	  position: absolute;
	  left: 50%;
	  top: 50%;
	  transform: translate(-50%, -50%) scale(4, 4);
      }
    </style>
  </head>
  <body>
  <button id="clickMe">Click Me!</button>
    <script>
    const fart = new Audio("  /home/fluffy_dwagon/codingprojects/html/fart-button/fart-83471.mp3")
    clickMe.onclick = () => {
	fart.current_time = 0;
	fart.play();
    }
  </script>
  </body>
</html>
